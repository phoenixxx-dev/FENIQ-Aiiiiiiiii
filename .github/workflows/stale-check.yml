# منبّه فحص انقطاع المزامنة — كل ساعة (المرحلة ٢).
#
# لماذا من خارج السيرفر: خطة Render المجانية تنام بعد ١٥ دقيقة بلا طلبات.
# مستودع توقّف = لا طلبات = سيرفر نائم = لا فحص. هذا الطلب يوقظه، يفحص، ويتركه ينام.
#
# يحتاج سرّاً واحداً بإعدادات الريبو: CRON_SECRET (نفس قيمته على Render).
# ⚠️ GitHub يوقف الجداول الزمنية بالريبو العام بعد ٦٠ يوماً بلا أي كوميت.
name: stale-check
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: فحص المستودعات المنقطعة
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API: https://feniq-api.onrender.com
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET غير مضبوط — تخطٍّ"; exit 0; fi
          # الإيقاظ الأول قد يأخذ ~٥٠ ثانية
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" "$API/v1/internal/check-stale"
