# نشر تجريبي على Render المجاني — ضغطة واحدة من Blueprint.
# ⚠️ للتجربة فقط: القرص مؤقت (الملفات تضيع عند إعادة التشغيل)، والخدمة تنام
# بعد ١٥ دقيقة خمول، وقاعدة البيانات المجانية تنتهي بعد ~٣٠ يوماً.
services:
  - type: web
    name: feniq-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    # الخطة المجانية بلا Background Worker، فيعمل عامل المعالجة بنفس الحاوية.
    dockerCommand: sh apps/api/start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: feniq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: feniq-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOCAL_STORAGE_DIR
        value: /tmp/phoenix-storage
      - key: MAX_FILE_SIZE_MB
        value: "20"
      # الواجهة على نطاق آخر — بدون هذا يرفض المتصفح كل طلب (CORS)
      - key: CORS_ORIGINS
        value: https://feniq-web.onrender.com
      # المرحلة ٢ — تُدخل يدوياً من لوحة Render (لا تُكتب هنا ولا بالمحادثة)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # نفس القيمة تُوضع سرّاً باسم CRON_SECRET بإعدادات ريبو GitHub
      - key: CRON_SECRET
        generateValue: true

  # الواجهة (Next.js). رابط الـAPI يُحقن وقت البناء (NEXT_PUBLIC_*).
  - type: web
    name: feniq-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://feniq-api.onrender.com

  - type: keyvalue
    name: feniq-redis
    plan: free
    ipAllowList: []

databases:
  - name: feniq-db
    plan: free
